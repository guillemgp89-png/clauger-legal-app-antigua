<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Imágenes — CLAUGER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Marca / navy */
  --navy: #1a2744;
  --navy-800: #22314f;
  --navy-700: #2c3a5c;
  --accent: #2f5aa6;
  --accent-700: #244a8c;
  --accent-soft: #eaf0fa;

  /* Superficies */
  --ecru: #f7f5f1;
  --surface: #ffffff;
  --surface-2: #fbfaf8;

  /* Tinta */
  --ink: #1a2744;
  --ink-2: #4d5670;
  --ink-3: #8189a0;
  --on-dark: #f4f6fb;
  --on-dark-2: rgba(244,246,251,.62);

  /* Líneas */
  --line: rgba(26,39,68,.10);
  --line-2: rgba(26,39,68,.18);
  --line-3: rgba(26,39,68,.30);
  --line-dark: rgba(244,246,251,.14);

  /* Feedback */
  --ok: #1f8a4c;   --ok-bg: #e9f5ee;
  --bad: #c0392b;  --bad-bg: #fbecea;
  --warn: #c2871a; --warn-bg: #fbf2e0;

  /* Tipografía */
  --display: 'Inter', system-ui, Arial, sans-serif;
  --body: 'Lato', system-ui, Arial, sans-serif;

  /* Radios y sombras */
  --r-sm: 4px; --r-md: 7px; --r-lg: 10px; --r-pill: 999px;
  --sh-sm: 0 1px 2px rgba(26,39,68,.06), 0 1px 1px rgba(26,39,68,.04);
  --sh-md: 0 4px 14px rgba(26,39,68,.08), 0 1px 3px rgba(26,39,68,.05);
  --sh-lg: 0 14px 38px rgba(26,39,68,.16), 0 3px 8px rgba(26,39,68,.08);
  --focus: 0 0 0 3px rgba(47,90,166,.28);
}

* { margin:0; padding:0; box-sizing:border-box; }
svg { display:block; }
body{
    font-family: var(--body);
    background: var(--navy);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px;
    -webkit-font-smoothing:antialiased;
}

/* ===== PANTALLA DE CARGA ===== */
#loadScreen{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:18px;
    color: var(--on-dark);
    text-align:center;
}
#loadScreen .load-icon{
    width:52px; height:52px;
    border-radius: var(--r-lg);
    background: rgba(244,246,251,.08);
    border: 1px solid var(--line-dark);
    display:flex; align-items:center; justify-content:center;
    color: var(--on-dark);
}
#loadScreen .load-icon svg{ width:26px; height:26px; }
#loadScreen h1{
    font-family: var(--display); font-size:1.5em; font-weight:700; letter-spacing:-.01em;
}
#loadScreen p{ font-size:.95em; color: var(--on-dark-2); }
#loadBtn{
    display:inline-flex; align-items:center; gap:8px;
    background: var(--accent);
    color:#fff;
    border:none;
    padding:.75rem 1.5rem;
    border-radius: var(--r-pill);
    cursor:pointer;
    font-family: var(--display);
    font-size:1em;
    font-weight:600;
    transition: background .15s ease;
}
#loadBtn:hover{ background: var(--accent-700); }
#loadBtn svg{ width:17px; height:17px; }
#fileInput{display:none}

/* ===== OVERLAY EDITOR ===== */
.image-editor-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(19,29,51,.6);
    backdrop-filter: blur(3px);
    z-index: 10000;
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: auto;
}
.image-editor-container {
    background: var(--surface);
    border-radius: var(--r-lg);
    padding: 20px;
    max-width: 95vw;
    max-height: 95vh;
    overflow: hidden;
    box-shadow: var(--sh-lg);
    display: flex;
    flex-direction: column;
}
.editor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line-2);
}
.editor-title {
    display:flex; align-items:center; gap:9px;
    font-family: var(--display);
    font-size: 1.05em;
    font-weight: 700;
    color: var(--ink);
    letter-spacing:-.01em;
}
.editor-title svg{ width:19px; height:19px; color: var(--accent); }
.editor-close {
    display:inline-flex; align-items:center; gap:6px;
    min-height:40px;
    background: var(--ink);
    color: #fff;
    border: none;
    padding: 0 .95rem;
    border-radius: var(--r-md);
    cursor: pointer;
    font-family: var(--display);
    font-size: .82rem;
    font-weight: 700;
    transition: background .15s ease;
}
.editor-close:hover { background: var(--navy-700); }

.editor-body {
    flex: 1;
    display: flex;
    gap: 14px;
    overflow: hidden;
}
.editor-toolbar {
    width: 56px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    flex-shrink: 0;
}
.editor-tool {
    width: 36px;
    height: 36px;
    background: var(--surface);
    color: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
}
.editor-tool svg{ width:17px; height:17px; }
.editor-tool:hover { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.editor-tool.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.editor-toolbar-sep{ height:1px; background: var(--line); margin:2px 0; flex-shrink:0; }

.editor-canvas-wrapper {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-width: 0;
}
.editor-canvas-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--ecru);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 10px;
    overflow: auto;
    position: relative;
    min-height: 300px;
}
.editor-canvas {
    border: 1px solid var(--line-2);
    background: white;
    box-shadow: var(--sh-sm);
    cursor: crosshair;
    touch-action: none;
    display: block;
}
.editor-properties {
    width: 200px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 15px;
    overflow-y: auto;
    flex-shrink: 0;
}
.property-group { margin-bottom: 16px; }
.property-group label {
    display: block;
    font-family: var(--display);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 7px;
    color: var(--ink-3);
}
.property-group label #currentToolName{
    color: var(--accent); font-weight:700; text-transform:none; letter-spacing:0;
}
.color-picker {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
}
.color-option {
    width: 30px;
    height: 30px;
    border: 2px solid var(--line);
    border-radius: var(--r-sm);
    cursor: pointer;
    transition: all .15s;
}
.color-option:hover { transform: scale(1.08); }
.color-option.active {
    border-color: var(--ink);
    box-shadow: var(--focus);
}
.property-input {
    width: 100%;
    padding: 5px;
    border: 1px solid var(--line-2);
    border-radius: var(--r-sm);
    accent-color: var(--accent);
}
.property-group > span{ font-size:11.5px; color: var(--ink-3); }

.action-btn{
    width: 100%;
    display:flex; align-items:center; justify-content:center; gap:7px;
    padding: .6rem;
    border: 1px solid transparent;
    border-radius: var(--r-md);
    cursor: pointer;
    font-family: var(--display);
    font-size: 13px;
    font-weight: 600;
    transition: background .15s ease;
    margin-bottom: 8px;
}
.action-btn svg{ width:15px; height:15px; }
.save-btn{ background: var(--ok); color:#fff; }
.save-btn:hover{ background:#186f3d; }
.download-btn{ background: var(--accent); color:#fff; margin-bottom:0; }
.download-btn:hover{ background: var(--accent-700); }

.crop-instructions {
    background: var(--warn-bg);
    padding: 10px 12px;
    border-radius: var(--r-md);
    border: 1px solid rgba(194,135,26,.35);
}
.crop-instructions strong { display:flex; align-items:center; gap:6px; color: var(--warn); font-family: var(--display); font-size:12px; margin-bottom: 6px; }
.crop-instructions strong svg{ width:14px; height:14px; }
.crop-instructions small { color: #8a6314; line-height: 1.5; font-size:11.5px; }

/* Toast */
.toast-editor {
    position: fixed;
    bottom: 20px; right: 20px;
    display:flex; align-items:center; gap:8px;
    background: var(--ink);
    color: var(--on-dark);
    font-family: var(--display);
    font-size:13px;
    font-weight:500;
    padding: 12px 18px;
    border-radius: var(--r-md);
    box-shadow: var(--sh-lg);
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 11000;
}
.toast-editor.show { transform: translateY(0); opacity: 1; }
.toast-editor.success { background: var(--ok); }
.toast-editor.error { background: var(--bad); }
.toast-editor.info { background: var(--navy-700); }

/* ===== RESPONSIVE ===== */
@media (max-width:768px){
    .image-editor-overlay{ padding:10px; }
    .image-editor-container{
        margin:5px;
        max-width:calc(100vw - 10px);
        max-height:calc(100vh - 10px);
        padding:15px;
    }
    .editor-body{ flex-direction:column; gap:10px; }
    .editor-toolbar{ width:100%; flex-direction:row; overflow-x:auto; padding:8px; }
    .editor-toolbar-sep{ width:1px; height:auto; margin:0 2px; }
    .editor-properties{ width:100%; max-height:200px; }
    .editor-canvas-container{ min-height:200px; max-height:50vh; }
    .editor-canvas{ max-width:100%; max-height:100%; width:auto; height:auto; }
}
@media (max-width:480px){
    .image-editor-container{ padding:10px; margin:5px; }
    .editor-header{ flex-direction:column; gap:8px; text-align:center; }
    .editor-title{ font-size:1em; }
    .editor-close{ align-self:center; }
    .editor-tool{ width:34px; height:34px; }
    .editor-canvas-container{ min-height:180px; max-height:45vh; padding:5px; }
}
@media (max-width:360px){
    .image-editor-overlay{ padding:5px; }
    .image-editor-container{ padding:8px; margin:2px; max-width:calc(100vw - 4px); max-height:calc(100vh - 4px); overflow-y:auto; }
    .editor-header{ flex-direction:column; gap:8px; margin-bottom:10px; }
    .editor-title{ font-size:.95em; }
    .editor-canvas{ max-width:calc(100vw - 20px); max-height:30vh; }
}
</style>
</head>
<body>

<!-- ===== PANTALLA DE CARGA ===== -->
<div id="loadScreen">
    <div class="load-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    </div>
    <h1>Editor de Imágenes</h1>
    <p>Abre una imagen para comenzar a editarla</p>
    <button id="loadBtn" onclick="document.getElementById('fileInput').click()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
        Abrir imagen
    </button>
    <input type="file" id="fileInput" accept="image/*" onchange="loadImageFromFile(this)">
    <p style="font-size:0.82em;opacity:0.6;margin-top:6px">
        JPG, PNG, GIF, WebP…
    </p>
</div>

<!-- ===== EDITOR ===== -->
<div class="image-editor-overlay" id="imageEditor">
    <div class="image-editor-container">
        <div class="editor-header">
            <h3 class="editor-title">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
                Editor de Imágenes
            </h3>
            <button class="editor-close" onclick="closeImageEditor()">
                ✕ Cerrar
            </button>
        </div>

        <div class="editor-body">
            <div class="editor-toolbar">
                <button class="editor-tool" data-tool="crop" title="Recortar">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                </button>
                <button class="editor-tool active" data-tool="arrow" title="Flecha">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
                </button>
                <button class="editor-tool" data-tool="circle" title="Círculo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/></svg>
                </button>
                <button class="editor-tool" data-tool="rectangle" title="Rectángulo">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1.5"/></svg>
                </button>
                <button class="editor-tool" data-tool="line" title="Línea">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/></svg>
                </button>
                <button class="editor-tool" data-tool="text" title="Texto">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </button>
                <button class="editor-tool" data-tool="pen" title="Dibujo libre">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                </button>
                <div class="editor-toolbar-sep"></div>
                <button class="editor-tool" onclick="rotateCanvas(-90)" title="Rotar izq. 90°">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                </button>
                <button class="editor-tool" onclick="rotateCanvas(90)" title="Rotar der. 90°">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                </button>
                <div class="editor-toolbar-sep"></div>
                <button class="editor-tool" onclick="undoEdit()" title="Deshacer">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
                </button>
                <button class="editor-tool" onclick="redoEdit()" title="Rehacer">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
                </button>
                <button class="editor-tool" onclick="clearAnnotations()" title="Limpiar anotaciones">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
                </button>
            </div>

            <div class="editor-canvas-wrapper">
                <div class="editor-canvas-container">
                    <canvas class="editor-canvas" id="editorCanvas"></canvas>
                </div>
            </div>

            <div class="editor-properties">
                <div class="property-group">
                    <label>Herramienta: <span id="currentToolName">Flecha</span></label>
                </div>
                <div class="property-group" id="cropInstructions" style="display:none;">
                    <div class="crop-instructions">
                        <strong>
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                            Modo Recorte
                        </strong>
                        <small>
                            1. Arrastra para seleccionar área<br>
                            2. Suelta para confirmar<br>
                            3. Confirma para aplicar
                        </small>
                    </div>
                </div>
                <div class="property-group">
                    <label>Color</label>
                    <div class="color-picker">
                        <div class="color-option active" style="background:#c0392b" data-color="#c0392b"></div>
                        <div class="color-option" style="background:#c2871a" data-color="#c2871a"></div>
                        <div class="color-option" style="background:#e0b400" data-color="#e0b400"></div>
                        <div class="color-option" style="background:#1f8a4c" data-color="#1f8a4c"></div>
                        <div class="color-option" style="background:#2f5aa6" data-color="#2f5aa6"></div>
                        <div class="color-option" style="background:#7d4fb0" data-color="#7d4fb0"></div>
                        <div class="color-option" style="background:#1a2744" data-color="#1a2744"></div>
                        <div class="color-option" style="background:#ffffff" data-color="#ffffff"></div>
                    </div>
                </div>
                <div class="property-group">
                    <label>Grosor</label>
                    <input type="range" class="property-input" min="1" max="10" value="3" id="strokeWidth">
                    <span id="strokeValue">3px</span>
                </div>
                <div class="property-group">
                    <label>Tamaño de texto</label>
                    <input type="range" class="property-input" min="12" max="48" value="20" id="fontSize">
                    <span id="fontValue">20px</span>
                </div>
                <div class="property-group" style="margin-bottom:0">
                    <button class="action-btn save-btn" onclick="saveEditedImage()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                        Guardar cambios
                    </button>
                    <button class="action-btn download-btn" onclick="downloadImage()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Descargar imagen
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast-editor" id="toastEditor"></div>

<script>
// ========== VARIABLES DEL EDITOR ==========
let editorCanvas = null;
let editorCtx = null;
let isDrawing = false;
let currentTool = 'arrow';
let currentColor = '#c0392b';
let currentStrokeWidth = 3;
let currentFontSize = 20;
let startX, startY;
let lastX, lastY;
let originalImage = null;
let canvasHistory = [];
let historyStep = -1;
let tempCanvas = null;
let tempCtx = null;
let cropRect = null;
let isCropping = false;
let documentMouseMoveHandler = null;
let documentMouseUpHandler = null;
let originalFileName = 'imagen_editada';

// ========== OBTENER COORDENADAS (compatible con touch/mouse) ==========
function getCanvasCoordinates(e, canvas) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    let clientX, clientY;
    if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else if (e.changedTouches && e.changedTouches.length > 0) {
        clientX = e.changedTouches[0].clientX;
        clientY = e.changedTouches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }
    return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
}

// ========== CARGA DE IMAGEN DESDE ARCHIVO ==========
function loadImageFromFile(input) {
    const file = input.files[0];
    if (!file) return;

    // Guardar nombre sin extensión para descarga
    originalFileName = file.name.replace(/\.[^/.]+$/, '') + '_editada';

    const reader = new FileReader();
    reader.onload = function(ev) {
        openImageEditor(ev.target.result);
    };
    reader.readAsDataURL(file);
}

// ========== INICIALIZAR EDITOR ==========
function initializeImageEditor() {
    setTimeout(() => {
        editorCanvas = document.getElementById('editorCanvas');
        if (!editorCanvas) return;
        editorCtx = editorCanvas.getContext('2d');

        const lineWidthSlider = document.getElementById('strokeWidth');
        const fontSizeSlider  = document.getElementById('fontSize');
        if (lineWidthSlider) {
            lineWidthSlider.addEventListener('input', function() {
                document.getElementById('strokeValue').textContent = this.value + 'px';
                currentStrokeWidth = parseInt(this.value);
            });
        }
        if (fontSizeSlider) {
            fontSizeSlider.addEventListener('input', function() {
                document.getElementById('fontValue').textContent = this.value + 'px';
                currentFontSize = parseInt(this.value);
            });
        }

        // Mouse events
        editorCanvas.addEventListener('mousedown', startDrawing);
        editorCanvas.addEventListener('mousemove', draw);
        editorCanvas.addEventListener('mouseup', stopDrawing);
        editorCanvas.addEventListener('mouseout', function(e) {
            const rect = editorCanvas.getBoundingClientRect();
            if (e.clientX < rect.left || e.clientX > rect.right ||
                e.clientY < rect.top  || e.clientY > rect.bottom) {
                if (isDrawing && currentTool !== 'crop') stopDrawing(e);
            }
        });

        // Document-level handlers para crop
        if (documentMouseMoveHandler) document.removeEventListener('mousemove', documentMouseMoveHandler);
        if (documentMouseUpHandler)   document.removeEventListener('mouseup',   documentMouseUpHandler);

        documentMouseMoveHandler = function(e) {
            if (isDrawing && currentTool === 'crop' && editorCanvas) draw(e);
        };
        documentMouseUpHandler = function(e) {
            if (isDrawing && currentTool === 'crop') stopDrawing(e);
        };
        document.addEventListener('mousemove', documentMouseMoveHandler);
        document.addEventListener('mouseup',   documentMouseUpHandler);

        // Touch events
        editorCanvas.addEventListener('touchstart', e => { e.preventDefault(); startDrawing(e); }, { passive: false });
        editorCanvas.addEventListener('touchmove',  e => { e.preventDefault(); if (isDrawing) draw(e); }, { passive: false });
        editorCanvas.addEventListener('touchend',   e => { e.preventDefault(); stopDrawing(e); }, { passive: false });

        setupEditorControls();
    }, 100);
}

// ========== CONFIGURAR CONTROLES ==========
function setupEditorControls() {
    document.querySelectorAll('.editor-tool[data-tool]').forEach(tool => {
        tool.addEventListener('click', function() {
            if (isDrawing) { isDrawing = false; tempCanvas = null; tempCtx = null; isCropping = false; cropRect = null; }
            document.querySelectorAll('.editor-tool[data-tool]').forEach(t => t.classList.remove('active'));
            this.classList.add('active');
            currentTool = this.getAttribute('data-tool');

            const toolNames = { crop:'Recortar', arrow:'Flecha', circle:'Círculo', rectangle:'Rectángulo', line:'Línea', text:'Texto', pen:'Dibujo libre' };
            const toolNameEl = document.getElementById('currentToolName');
            if (toolNameEl) toolNameEl.textContent = toolNames[currentTool] || currentTool;

            if (editorCanvas) {
                if (currentTool === 'text') editorCanvas.style.cursor = 'text';
                else editorCanvas.style.cursor = 'crosshair';
            }
            const cropInstructions = document.getElementById('cropInstructions');
            if (cropInstructions) cropInstructions.style.display = currentTool === 'crop' ? 'block' : 'none';
            if (currentTool === 'crop') showToastEditor('Arrastra para seleccionar el área a recortar', 'info');
        });
    });

    document.querySelectorAll('.color-option').forEach(option => {
        option.addEventListener('click', function() {
            document.querySelectorAll('.color-option').forEach(o => o.classList.remove('active'));
            this.classList.add('active');
            currentColor = this.getAttribute('data-color');
        });
    });
}

// ========== ABRIR EDITOR ==========
function openImageEditor(imageSrc) {
    document.getElementById('imageEditor').style.display = 'flex';
    document.getElementById('loadScreen').style.display = 'none';

    if (!editorCanvas) initializeImageEditor();

    const editorImage = new Image();
    editorImage.onload = function() {
        const isMobile = window.innerWidth <= 768;
        const maxWidth  = isMobile ? Math.min(window.innerWidth - 40, 600) : 900;
        const maxHeight = isMobile ? Math.min(window.innerHeight * 0.4, 400) : 650;

        let { width, height } = this;
        if (width > maxWidth || height > maxHeight) {
            const scale = Math.min(maxWidth / width, maxHeight / height);
            width  = Math.floor(width  * scale);
            height = Math.floor(height * scale);
        }

        editorCanvas.width  = width;
        editorCanvas.height = height;
        editorCtx.clearRect(0, 0, width, height);
        editorCtx.drawImage(this, 0, 0, width, height);

        originalImage = { img: this, width, height };
        canvasHistory = [];
        historyStep = -1;
        saveCanvasState();
    };
    editorImage.onerror = function() { alert('Error al cargar la imagen en el editor.'); };
    editorImage.src = imageSrc;
}

// ========== CERRAR EDITOR ==========
function closeImageEditor() {
    document.getElementById('imageEditor').style.display = 'none';
    document.getElementById('loadScreen').style.display = 'flex';
    // Reset file input para poder cargar la misma imagen de nuevo
    document.getElementById('fileInput').value = '';
    originalImage = null;
    isDrawing = false;
    if (editorCanvas && editorCtx) editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
    tempCanvas = null; tempCtx = null; isCropping = false; cropRect = null;
}

// ========== DIBUJO ==========
function startDrawing(e) {
    e.preventDefault();
    isDrawing = true;
    const coords = getCanvasCoordinates(e, editorCanvas);
    startX = coords.x; startY = coords.y; lastX = startX; lastY = startY;

    editorCtx.strokeStyle = currentColor;
    editorCtx.lineWidth = currentStrokeWidth;
    editorCtx.lineCap = 'round';
    editorCtx.lineJoin = 'round';

    if (currentTool === 'crop') {
        isCropping = true;
        cropRect = { x: startX, y: startY, width: 0, height: 0 };
        tempCanvas = document.createElement('canvas');
        tempCanvas.width = editorCanvas.width;
        tempCanvas.height = editorCanvas.height;
        tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(editorCanvas, 0, 0);
    } else if (currentTool === 'pen') {
        editorCtx.beginPath();
        editorCtx.moveTo(startX, startY);
    } else if (currentTool === 'text') {
        const text = prompt('Escriba el texto:');
        if (text) {
            editorCtx.font = `${currentFontSize}px Arial`;
            editorCtx.fillStyle = currentColor;
            editorCtx.fillText(text, startX, startY);
            saveCanvasState();
        }
        isDrawing = false;
    } else {
        tempCanvas = document.createElement('canvas');
        tempCanvas.width = editorCanvas.width;
        tempCanvas.height = editorCanvas.height;
        tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(editorCanvas, 0, 0);
    }
}

function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    const coords = getCanvasCoordinates(e, editorCanvas);
    let currentX = coords.x;
    let currentY = coords.y;
    if (currentTool === 'crop') {
        currentX = Math.max(0, Math.min(currentX, editorCanvas.width));
        currentY = Math.max(0, Math.min(currentY, editorCanvas.height));
    }
    lastX = currentX; lastY = currentY;

    if (currentTool === 'crop') {
        if (cropRect && tempCanvas) {
            editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height);
            editorCtx.drawImage(tempCanvas, 0, 0);
            cropRect.width  = currentX - cropRect.x;
            cropRect.height = currentY - cropRect.y;
            editorCtx.strokeStyle = '#2f5aa6';
            editorCtx.lineWidth = 2;
            editorCtx.setLineDash([5, 5]);
            editorCtx.strokeRect(cropRect.x, cropRect.y, cropRect.width, cropRect.height);
            editorCtx.fillStyle = 'rgba(26,39,68,0.35)';
            const x1 = Math.min(cropRect.x, cropRect.x + cropRect.width);
            const x2 = Math.max(cropRect.x, cropRect.x + cropRect.width);
            const y1 = Math.min(cropRect.y, cropRect.y + cropRect.height);
            const y2 = Math.max(cropRect.y, cropRect.y + cropRect.height);
            editorCtx.fillRect(0, 0, editorCanvas.width, y1);
            editorCtx.fillRect(0, y2, editorCanvas.width, editorCanvas.height - y2);
            editorCtx.fillRect(0, y1, x1, y2 - y1);
            editorCtx.fillRect(x2, y1, editorCanvas.width - x2, y2 - y1);
            editorCtx.setLineDash([]);
            editorCtx.fillStyle = '#2f5aa6';
            editorCtx.font = '12px Arial';
            const w = Math.abs(cropRect.width), h = Math.abs(cropRect.height);
            if (w > 50 && h > 30) editorCtx.fillText(`${Math.round(w)} x ${Math.round(h)}`, x1 + 5, y1 + 15);
        }
    } else if (currentTool === 'pen') {
        editorCtx.lineTo(currentX, currentY);
        editorCtx.stroke();
    } else if (['line','arrow','rectangle','circle'].includes(currentTool)) {
        if (tempCanvas) { editorCtx.clearRect(0, 0, editorCanvas.width, editorCanvas.height); editorCtx.drawImage(tempCanvas, 0, 0); }
        editorCtx.strokeStyle = currentColor;
        editorCtx.lineWidth = currentStrokeWidth;
        editorCtx.lineCap = 'round'; editorCtx.lineJoin = 'round';
        switch(currentTool) {
            case 'line':
                editorCtx.beginPath(); editorCtx.moveTo(startX, startY); editorCtx.lineTo(currentX, currentY); editorCtx.stroke(); break;
            case 'arrow':
                drawArrow(startX, startY, currentX, currentY); break;
            case 'rectangle':
                editorCtx.beginPath(); editorCtx.rect(startX, startY, currentX - startX, currentY - startY); editorCtx.stroke(); break;
            case 'circle':
                editorCtx.beginPath();
                editorCtx.arc(startX, startY, Math.sqrt(Math.pow(currentX-startX,2)+Math.pow(currentY-startY,2)), 0, 2*Math.PI, false);
                editorCtx.stroke(); break;
        }
    }
}

function stopDrawing(e) {
    if (!isDrawing) return;
    if (e) e.preventDefault();
    if (currentTool === 'crop' && cropRect) {
        if (Math.abs(cropRect.width) > 10 && Math.abs(cropRect.height) > 10) {
            if (confirm('¿Desea aplicar el recorte?')) applyCrop();
            else { if (tempCanvas) { editorCtx.clearRect(0,0,editorCanvas.width,editorCanvas.height); editorCtx.drawImage(tempCanvas,0,0); } }
        } else {
            if (tempCanvas) { editorCtx.clearRect(0,0,editorCanvas.width,editorCanvas.height); editorCtx.drawImage(tempCanvas,0,0); }
        }
        isCropping = false; cropRect = null; tempCanvas = null; tempCtx = null;
    } else if (!['pen','text'].includes(currentTool)) {
        let finalX = lastX || startX, finalY = lastY || startY;
        if (e) { const c = getCanvasCoordinates(e, editorCanvas); finalX = c.x; finalY = c.y; }
        if (tempCanvas) { editorCtx.clearRect(0,0,editorCanvas.width,editorCanvas.height); editorCtx.drawImage(tempCanvas,0,0); }
        editorCtx.strokeStyle = currentColor;
        editorCtx.lineWidth = currentStrokeWidth;
        editorCtx.lineCap = 'round'; editorCtx.lineJoin = 'round';
        switch(currentTool) {
            case 'line':
                editorCtx.beginPath(); editorCtx.moveTo(startX,startY); editorCtx.lineTo(finalX,finalY); editorCtx.stroke(); break;
            case 'arrow':
                drawArrow(startX, startY, finalX, finalY); break;
            case 'rectangle':
                editorCtx.beginPath(); editorCtx.rect(startX,startY,finalX-startX,finalY-startY); editorCtx.stroke(); break;
            case 'circle':
                editorCtx.beginPath();
                editorCtx.arc(startX, startY, Math.sqrt(Math.pow(finalX-startX,2)+Math.pow(finalY-startY,2)), 0, 2*Math.PI, false);
                editorCtx.stroke(); break;
        }
        tempCanvas = null; tempCtx = null;
    }
    isDrawing = false;
    if (currentTool !== 'crop') saveCanvasState();
}

// ========== RECORTE ==========
function applyCrop() {
    if (!cropRect || !tempCanvas) return;
    const x = Math.min(cropRect.x, cropRect.x + cropRect.width);
    const y = Math.min(cropRect.y, cropRect.y + cropRect.height);
    const w = Math.abs(cropRect.width), h = Math.abs(cropRect.height);
    const croppedCanvas = document.createElement('canvas');
    croppedCanvas.width = w; croppedCanvas.height = h;
    croppedCanvas.getContext('2d').drawImage(tempCanvas, x, y, w, h, 0, 0, w, h);
    editorCanvas.width = w; editorCanvas.height = h;
    editorCtx.clearRect(0,0,w,h);
    editorCtx.drawImage(croppedCanvas, 0, 0);
    const img = new Image();
    img.onload = function() { originalImage = { img, width:w, height:h }; saveCanvasState(); showToastEditor('Imagen recortada', 'success'); };
    img.src = editorCanvas.toDataURL();
}

// ========== FLECHA ==========
function drawArrow(fromX, fromY, toX, toY) {
    const headLength = 15;
    const angle = Math.atan2(toY - fromY, toX - fromX);
    editorCtx.beginPath();
    editorCtx.moveTo(fromX, fromY);
    editorCtx.lineTo(toX, toY);
    editorCtx.lineTo(toX - headLength * Math.cos(angle - Math.PI/6), toY - headLength * Math.sin(angle - Math.PI/6));
    editorCtx.moveTo(toX, toY);
    editorCtx.lineTo(toX - headLength * Math.cos(angle + Math.PI/6), toY - headLength * Math.sin(angle + Math.PI/6));
    editorCtx.stroke();
}

// ========== HISTORIAL ==========
function saveCanvasState() {
    historyStep++;
    if (historyStep < canvasHistory.length) canvasHistory.length = historyStep;
    canvasHistory.push(editorCanvas.toDataURL());
}
function restoreCanvas() {
    if (canvasHistory[historyStep]) {
        const img = new Image();
        img.onload = function() { editorCtx.clearRect(0,0,editorCanvas.width,editorCanvas.height); editorCtx.drawImage(img,0,0); };
        img.src = canvasHistory[historyStep];
    }
}
function undoEdit() {
    if (historyStep > 0) { historyStep--; restoreCanvas(); showToastEditor('Acción deshecha', 'info'); }
    else showToastEditor('No hay acciones para deshacer', 'info');
}
function redoEdit() {
    if (historyStep < canvasHistory.length - 1) { historyStep++; restoreCanvas(); showToastEditor('Acción rehecha', 'info'); }
    else showToastEditor('No hay acciones para rehacer', 'info');
}

// ========== LIMPIAR / ROTAR ==========
function clearAnnotations() {
    if (originalImage && originalImage.img) {
        editorCtx.clearRect(0,0,editorCanvas.width,editorCanvas.height);
        editorCtx.fillStyle = 'white';
        editorCtx.fillRect(0,0,editorCanvas.width,editorCanvas.height);
        editorCtx.drawImage(originalImage.img, 0, 0, originalImage.width, originalImage.height);
        saveCanvasState();
        showToastEditor('Anotaciones eliminadas', 'info');
    }
}
function rotateCanvas(degrees) {
    if (!editorCanvas || !editorCtx) return;
    const rad = degrees * Math.PI / 180;
    const srcW = editorCanvas.width, srcH = editorCanvas.height;
    const tmpCvs = document.createElement('canvas');
    tmpCvs.width = srcH; tmpCvs.height = srcW;
    const tmpCtx = tmpCvs.getContext('2d');
    tmpCtx.translate(tmpCvs.width/2, tmpCvs.height/2);
    tmpCtx.rotate(rad);
    tmpCtx.drawImage(editorCanvas, -srcW/2, -srcH/2);
    editorCanvas.width = tmpCvs.width; editorCanvas.height = tmpCvs.height;
    editorCtx.drawImage(tmpCvs, 0, 0);
    if (originalImage) { originalImage.width = editorCanvas.width; originalImage.height = editorCanvas.height; }
    saveCanvasState();
    showToastEditor('Imagen rotada', 'success');
}

// ========== GUARDAR / DESCARGAR ==========
function saveEditedImage() {
    // En modo standalone: guarda el estado actual como nuevo "original"
    if (!editorCanvas) return;
    const dataUrl = editorCanvas.toDataURL('image/png', 0.9);
    const img = new Image();
    img.onload = function() {
        originalImage = { img, width: editorCanvas.width, height: editorCanvas.height };
        canvasHistory = [];
        historyStep = -1;
        saveCanvasState();
        showToastEditor('Cambios guardados como nueva base', 'success');
    };
    img.src = dataUrl;
}

function downloadImage() {
    if (!editorCanvas) return;
    const dataUrl = editorCanvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = originalFileName + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToastEditor('Imagen descargada', 'success');
}

// ========== TOAST ==========
function showToastEditor(message, type = 'info') {
    const toast = document.getElementById('toastEditor');
    toast.textContent = message;
    toast.className = `toast-editor show ${type}`;
    setTimeout(() => toast.classList.remove('show'), 3000);
}

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', function() {
    initializeImageEditor();
});
</script>
